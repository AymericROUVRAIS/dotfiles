; Decorations for the bar
[colors]
background = #00000000
; #00 : transparent; #aa : semi-transparent
altbackground = #373B41
foreground = #C5C8C6
altforeground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabledMAGENTA = #707880

BLACK = #3B4252
RED = #BF616A
GREEN = #A3BE8C
YELLOW = #EBCB8B
BLUE = #81A1C1
MAGENTA = #B48EAD
CYAN = #88C0D0
WHITE = #E5E9F0
GREY = #808080
ALTBLACK = #4C566A
ALTRED = #BF616A
ALTGREEN = #A3BE8C
ALTYELLOW = #EBCB8B
ALTBLUE = #81A1C1
ALTMAGENTA = #B48EAD
ALTCYAN = #8FBCBB
ALTWHITE = #ECEFF4




[module/sep]
type = custom/text
format = -
format-background = ${colors.altbackground}
format-foreground = ${colors.altbackground}

[module/LD]
type = custom/text
format = "%{T4}%{T-}"
format-background = ${colors.background}
format-foreground = ${colors.altbackground}

[module/RD]
type = custom/text
format = "%{T4}%{T-}"
format-background = ${colors.background}
format-foreground = ${colors.altbackground}


; --------------------------------------- ;

; Main module configurations
[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false

enable-click = false
enable-scroll = true
reverse-scroll = true

fuzzy-match = true

format = <label-state>
format-background = ${colors.altbackground}
format-font = 1

label-monitor = %name%

; Focused desktop
label-focused = ●
label-focused-foreground = ${colors.GREEN}
; Occupied desktop
label-occupied = ●
label-occupied-foreground = ${colors.GREY}
; Urgent desktop
label-urgent = ●
label-urgent-foreground = ${colors.alert}
; Empty desktop
label-empty = ○
label-empty-foreground = ${colors.GREY}

; Separator in between workspaces
label-separator = ""
label-separator-padding = 0
label-separator-foreground = ${colors.altbackground}

; -------------------------------------------- ;

[module/mod]
type = internal/bspwm

format = <label-mode>
format-background = ${colors.altbackground}
format-foreground = ${colors.YELLOW}
format-padding = 0

label-monocle = "Monocle"

label-floating = "Float"
label-pseudotiled = "Pseudo"
label-fullscreen = "Full"

label-locked = " |Locked|"
label-sticky = " |Sticky|"
label-private = " |Private|"


; -------------------------------------------- ;
[module/brightness]
type = internal/backlight

; Use the following command to list available cards:
; $ ls -1 /sys/class/backlight/
# card = ${system.sys_graphics_card}
card = intel_backlight

enable-scroll = true

; Available tags:
;   <label> (default)
;   <ramp>
;   <bar>
format = <ramp> <label>
format-background = ${colors.altbackground}
format-padding = 1

; Available tokens:
;   %percentage% (default)
label = %percentage%%

; Only applies if <ramp> is used
ramp-0 = 󰃞
ramp-1 = 󰃞
ramp-2 = 󰃞
ramp-3 = 󰃟
ramp-4 = 󰃟
ramp-5 = 󰃟
ramp-6 = 󰃟
ramp-7 = 󰃠
ramp-8 = 󰃠
ramp-9 = 󰃠
ramp-font = 2
ramp-foreground = ${colors.CYAN}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/battery]
type = internal/battery

; This is useful in case the battery never reports 100% charge
full-at = 99

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}

poll-interval = 2

; see "man date" for details on how to format the time string
; Default: %H:%M:%S
time-format = %H:%M

; Available tags:
;   <label-charging> (default)
;   <bar-capacity>
;   <ramp-capacity>
;   <animation-charging>
format-charging = <animation-charging> <label-charging>
format-charging-prefix-font = 1
format-charging-prefix-foreground = ${colors.RED}
format-charging-background = ${colors.altbackground}

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.altbackground}

;format-full = <ramp-capacity> <label-full>

; Available tokens:
;   %percentage% (default)
;   %time%
;   %consumption% (shows current charge rate in watts)
label-charging = %percentage%%

label-discharging = %percentage%%

; Available tokens:
;   %percentage% (default)
format-full = <label-full>
format-full-prefix = " "
format-full-prefix-font = 2
format-full-prefix-foreground = ${colors.GREEN}
format-full-background = ${colors.altbackground}
label-full = %percentage%%

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.YELLOW}
ramp-capacity-font = 2

; Only applies if <animation-charging> is used
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.GREEN}
animation-charging-font = 2
animation-charging-framerate = 700

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/cpu]
type = internal/cpu

; Seconds to sleep between updates
; Default: 1
interval = 0.5

; make module clickable with %{A}
format = %{A1:~/.local/bin/power_config.sh:}<label>%{A}
format-prefix =  
format-prefix-font = 2
format-prefix-foreground = ${colors.YELLOW}
format-background = ${colors.altbackground}
format-padding = 1

; Available tokens:
;   %percentage% (default) - total cpu load averaged over all cores
;   %percentage-sum% - Cumulative load on all cores
;   %percentage-cores% - load percentage for each core
;   %percentage-core[1-9]% - load percentage for s/pecific core
label = " %percentage%%"


;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/temperature]
type = internal/temperature

; Seconds to sleep between updates
interval = 2

format = <label>
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${colors.ALTRED}
format-background = ${colors.altbackground}
format-padding = 1
; Thermal zone to use
; To list all the zone types, run 
; $ for i in /sys/class/thermal/thermal_zone*; do echo "$i: $(<$i/type)"; done
; Default: 0
thermal-zone = 0

; Select thermal zone by name
; The name has to match the contents of /sys/class/thermal/thermal_zone*/type
; for the desired thermal zone.
; New in version 3.7.0
; Default: ""
zone-type = x86_pkg_temp

; Full path of temperature sysfs path
; Use `sensors` to find preferred temperature source, then run
; $ for i in /sys/class/hwmon/hwmon*/temp*_input; do echo "$(<$(dirname $i)/name): $(cat ${i%_*}_label 2>/dev/null || echo $(basename ${i%_*})) $(readlink -f $i)"; done
; to find path to desired file
; Default reverts to thermal zone setting
hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon2/temp1_input

; Base temperature for where to start the ramp (in degrees celsius)
base-temperature = 20
; Threshold temperature to display warning label (in degrees celsius)
warn-temperature = 60

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/date]
type = internal/date

; Seconds to sleep between updates
interval = 1.0

; See "http://en.cppreference.com/w/cpp/io/manip/put_time" for details on how to format the date string
; NOTE: if you want to use syntax tags here you need to use %%{...}
;;date = %Y-%m-%d%
; man date for formating information
; Optional time format
time =  %H:%M

; if `date-alt` or `time-alt` is defined, clicking
; the module will toggle between formats
;;date-alt = %A, %d %B %Y
#time-alt = %d/%m/%Y%
time-alt =   %A %b %d, %G

; Available tags:
;   <label> (default)

format = <label>
format-prefix =
format-prefix-font = 2
format-prefix-foreground = ${colors.RED}
format-background = ${colors.altbackground}

; Available tokens:
;   %date%
;   %time%
; Default: %date%
label = %time%
label-font = 1 

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/memory]
type = internal/memory

interval = 3

format = <label>
format-background = ${colors.altbackground}
format-padding = 1

format-prefix = 
format-prefix-font = 2
format-prefix-padding = 0.5
format-prefix-foreground = ${colors.CYAN}

label = " %mb_used%"

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/network]
type = internal/network
interface = ${system.sys_network_interface}

; Seconds to sleep between updates
interval = 1.0
accumulate-stats = true
unknown-as-up = true

format-connected-prefix = "󰖩 "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.ALTCYAN}

format-connected = <label-connected>
format-connected-background = ${colors.altbackground}
format-connected-padding = 1

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰤠 "
format-disconnected-prefix-font = 2
format-disconnected-foreground = ${colors.altforeground}
format-disconnected-background = ${colors.altbackground}
format-disconnected-padding = 1

; Available tokens:
;   %ifname%    [wireless+wired]
;   %local_ip%  [wireless+wired]
;   %local_ip6% [wireless+wired]
;   %essid%     [wireless]
;   %signal%    [wireless]
;   %upspeed%   [wireless+wired]
;   %downspeed% [wireless+wired]
;   %linkspeed% [wired]
; Default: %ifname% %local_ip%
;label-connected = "%essid%  %downspeed%"
label-connected = "%{A1:nmd &:}%essid%%{A}"
label-disconnected = "%{A1:nmd &:}Offline%{A}"



;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/bluetooth]
type = custom/script
exec = ~/.local/bin/bluetooth.sh
interval = 1
tail = true
format = <label>
label = %output%
format-padding = 1
format-prefix = "󰂯 "
format-prefix-font = 2
format-prefix-foreground = ${colors.CYAN}
format-background=${colors.altbackground}

click-left =

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
[module/volume]
type = internal/pulseaudio

; Use PA_VOLUME_UI_MAX (~153%) if true, or PA_VOLUME_NORM (100%) if false
; Default: true
use-ui-max = true

; Interval for volume increase/decrease (in percent points)
interval = 5

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.altbackground}
format-volume-padding = 1
format-muted = <label-muted>
format-muted-prefix = 󰖁
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.CYAN}
format-muted-background = ${colors.altbackground}
format-muted-padding = 1

label-muted = " Mute"
label-muted-foreground = ${colors.altforeground}

bar-volume-indicator = 雷
bar-volume-indicator-font = 2
bar-volume-indicator-foreground = ${colors.BLUE}

bar-volume-fill = 絛
bar-volume-fill-font = 3
bar-volume-foreground-0 = ${colors.BLUE}
bar-volume-foreground-1 = ${colors.BLUE}
bar-volume-foreground-2 = ${colors.BLUE}
bar-volume-foreground-3 = ${colors.BLUE}
bar-volume-foreground-4 = ${colors.BLUE}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰕿
ramp-volume-2 = 󰕿
ramp-volume-3 = 󰖀
ramp-volume-4 = 󰖀
ramp-volume-5 = 󰖀
ramp-volume-6 = 󰕾
ramp-volume-7 = 󰕾
ramp-volume-8 = 󰕾
ramp-volume-9 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = ${colors.BLUE}
; ramp-volume-background = ${colors.altbackground}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/title]
type = internal/xwindow

; Available tags:
;   <label> (default)
format = <label>
format-prefix = 
format-prefix-font = 2
format-prefix-foreground = ${colors.BLUE}
format-background = ${colors.altbackground}

; Available tokens:
;   %title%
; Default: %title%
label = %title%
label-maxlen = 25

; Used instead of label when there is no window title
; Available tokens:
;   None
label-empty = Desktop
;label-empty-foreground = ${colors.ALTBLACK}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/menu]
type = custom/text

format = 
format-font = 6
format-background = ${colors.altbackground}
format-foreground = ${colors.GREEN}
format-padding = 0

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/sysmenu]
type = custom/text

format = "󰐥"
format-font = 2
format-background = ${colors.altbackground}
format-foreground = ${colors.RED}
format-padding = 1

click-left = ~/.local/bin/powermenu.sh


